name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm --filter @tyx1703/json-schema-editor-visual test

      - name: E2E tests
        run: pnpm e2e

  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build library
        run: pnpm --filter @tyx1703/json-schema-editor-visual build

      - name: Build docs
        run: pnpm --filter docs doc:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/doc_build

      - id: deploy
        uses: actions/deploy-pages@v4
